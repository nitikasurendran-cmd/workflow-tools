<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little List</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #f0f5ed;
  color: #294635;
  font-family: system-ui, sans-serif;
}
main { max-width: 620px; margin: 65px auto; padding: 20px; }
h1 { text-align: center; font-size: 44px; margin-bottom: 8px; }
.subtitle { text-align: center; color: #71816c; margin-bottom: 30px; }
.card {
  background: white;
  padding: 24px;
  border-radius: 18px;
  box-shadow: 0 12px 40px #29463512;
}
form { display: flex; gap: 10px; }
input[type="text"] {
  flex: 1;
  min-width: 0;
  padding: 13px;
  border: 1px solid #d5dfcf;
  border-radius: 8px;
  font: inherit;
}
button {
  cursor: pointer;
  border: none;
  border-radius: 8px;
  padding: 12px;
  background: #365e49;
  color: white;
  font: inherit;
}
button:focus-visible, input:focus-visible {
  outline: 3px solid #8eaf7d;
  outline-offset: 3px;
}
.filters { display: flex; gap: 8px; margin: 20px 0; flex-wrap: wrap; }
.filters button { background: #edf3e9; color: #365e49; font-size: 13px; }
.filters button[aria-pressed="true"] { background: #365e49; color: white; }
ul { list-style: none; padding: 0; }
li { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-bottom: 1px solid #edf0e9; }
li label { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }
li span { overflow-wrap: anywhere; }
input[type="checkbox"] { width: 19px; height: 19px; accent-color: #365e49; }
.done span { text-decoration: line-through; color: #8d9987; }
.delete { background: #faeeee; color: #a44747; padding: 6px 10px; }
#empty { text-align: center; color: #829079; padding: 25px 0; }
footer { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#count, #note { font-size: 12px; color: #78866f; }
#clear { background: transparent; color: #58704c; font-size: 12px; }
#clear:disabled { opacity: .4; cursor: default; }
#note { text-align: center; margin-top: 20px; }
@media (max-width: 420px) {
  main { margin: 25px auto; padding: 14px; }
  .card { padding: 16px; }
  form { flex-wrap: wrap; }
  input[type="text"] { width: 100%; }
}
</style>
</head>
<body>
<main>
  <h1>Little List 🌿</h1>
  <p class="subtitle">Clear your mind. One task at a time.</p>
  <section class="card" aria-label="Your tasks">
    <form id="form">
      <input id="input" type="text" aria-label="New task"
        placeholder="What would you like to do?" maxlength="200"
        autocomplete="off" required>
      <button type="submit">Add task</button>
    </form>
    <div class="filters" role="group" aria-label="Filter tasks">
      <button data-filter="all" aria-pressed="true">All</button>
      <button data-filter="active" aria-pressed="false">Active</button>
      <button data-filter="completed" aria-pressed="false">Completed</button>
    </div>
    <ul id="list" aria-label="Task list"></ul>
    <p id="empty">Your list is empty. Add a task above!</p>
    <footer>
      <span id="count" aria-live="polite"></span>
      <button id="clear">Clear completed</button>
    </footer>
  </section>
  <p id="note">Saved in this browser · Small steps count.</p>
</main>
<script>
const key = "little-list-single-v1";
let tasks = [];
let filter = "all";
const input = document.querySelector("#input");
const list = document.querySelector("#list");
const note = document.querySelector("#note");
const clear = document.querySelector("#clear");

try {
  const saved = JSON.parse(localStorage.getItem(key) || "[]");
  if (Array.isArray(saved)) {
    tasks = saved.filter(t =>
      t && typeof t.text === "string" && typeof t.done === "boolean"
    );
  }
} catch {
  note.textContent = "Browser storage unavailable; tasks may not be saved.";
}

function save() {
  try {
    localStorage.setItem(key, JSON.stringify(tasks));
  } catch {
    note.textContent = "Could not save. Keep this tab open.";
  }
  render();
}

function render() {
  list.replaceChildren();
  const visible = tasks.filter(t =>
    filter === "all" ||
    (filter === "completed" ? t.done : !t.done)
  );

  visible.forEach(task => {
    const row = document.createElement("li");
    row.classList.toggle("done", task.done);

    const label = document.createElement("label");
    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = task.done;
    checkbox.addEventListener("change", () => {
      task.done = checkbox.checked;
      save();
    });

    const text = document.createElement("span");
    text.textContent = task.text;
    label.append(checkbox, text);

    const remove = document.createElement("button");
    remove.className = "delete";
    remove.textContent = "×";
    remove.setAttribute("aria-label", "Delete " + task.text);
    remove.addEventListener("click", () => {
      tasks = tasks.filter(t => t !== task);
      save();
    });

    row.append(label, remove);
    list.append(row);
  });

  const remaining = tasks.filter(t => !t.done).length;
  document.querySelector("#count").textContent =
    remaining + (remaining === 1 ? " task left" : " tasks left");

  const empty = document.querySelector("#empty");
  empty.hidden = visible.length > 0;
  empty.textContent = tasks.length === 0
    ? "Your list is empty. Add a task above!"
    : filter === "completed"
      ? "No completed tasks yet."
      : "All clear. You're caught up!";

  clear.disabled = !tasks.some(t => t.done);
}

document.querySelector("#form").addEventListener("submit", event => {
  event.preventDefault();
  const text = input.value.trim();
  if (text) {
    tasks.push({ text, done: false });
    save();
  }
  input.value = "";
  input.focus();
});

document.querySelectorAll("[data-filter]").forEach(button => {
  button.addEventListener("click", () => {
    filter = button.dataset.filter;
    document.querySelectorAll("[data-filter]").forEach(item => {
      item.setAttribute("aria-pressed", String(item === button));
    });
    render();
  });
});

clear.addEventListener("click", () => {
  tasks = tasks.filter(t => !t.done);
  save();
});

render();
</script>
</body>
</html>
